name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published version, without the v prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${TAG#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          mkdir -p dist
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir dist
          python3 scripts/verify-assets.py dist "$version"
