name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit tests (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --enable-code-coverage
      - name: Validate shell scripts
        run: bash -n build.sh scripts/release.sh scripts/verify-release.sh
      - name: Build universal development candidate
        env:
          ARCH: universal
        run: bash build.sh
      - name: Verify architectures and bundle
        run: |
          lipo -verify_arch arm64 x86_64 build/InputPin.app/Contents/MacOS/InputPin
          codesign --verify --strict build/InputPin.app
          plutil -lint build/InputPin.app/Contents/Info.plist
          build/InputPin.app/Contents/MacOS/InputPin --version
      - name: Archive development candidate (not a public release)
        run: ditto -c -k --keepParent build/InputPin.app build/InputPin-development.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InputPin-development-universal
          path: build/InputPin-development.zip
          retention-days: 7
