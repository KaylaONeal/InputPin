name: InputPin
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ARCHS: 'arm64 x86_64'
    ONLY_ACTIVE_ARCH: NO
targets:
  InputPinCore:
    type: library.static
    platform: macOS
    sources: [Sources/InputPinCore]
    settings:
      base:
        PRODUCT_MODULE_NAME: InputPinCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  InputPin:
    type: application
    platform: macOS
    sources:
      - path: Sources/InputPin
      - path: store/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: build/store-assets/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: InputPinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kaylaoneal.InputPin
        PRODUCT_NAME: InputPin
        INFOPLIST_FILE: store/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: store/InputPin.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) APP_STORE'
        MARKETING_VERSION: '1.0.2'
        CURRENT_PROJECT_VERSION: '1'
        SKIP_INSTALL: NO
schemes:
  InputPin:
    build:
      targets:
        InputPin: all
    archive:
      config: Release
